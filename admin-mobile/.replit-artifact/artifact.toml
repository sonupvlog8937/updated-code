kind = "mobile"
previewPath = "/"
title = "Admin Mobile"
description = "A full-featured admin panel mobile app converted from React web to React Native TypeScript Expo. Supports multiple roles (Admin, Seller variants, Delivery Rider) with screens for Dashboard, Orders, Products, Categories, Users, Wallet, and Profile management. Uses REST API with Bearer token auth and AsyncStorage for token persistence."
version = "1.0.0"
id = "artifacts/admin-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20369

[services.development]
run = "pnpm --filter @workspace/admin-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/admin-mobile", "run", "serve" ]

[services.env]
PORT = "20369"
BASE_PATH = "/"
